[package]
name = "py_rust_cuda_ml_framework"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_backend"
path = "src/lib.rs"
crate-type = ["cdylib"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = {version = "0.15.6", features = ["serde", "rayon", "matrixmultiply-threading"]}

rayon = "1.10"
nalgebra = "0.33.0"
rand_distr = "0.4.3"
random_choice = "0.3.2"
memmap2 = "0.9.4"
bincode = "1.3.3"
half = "2.4.1"